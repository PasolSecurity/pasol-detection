[workspace]
members = [
    "crates/pasol-detection-sdk",
    "crates/pasol-features",
    "crates/pasol-rules",
    "crates/pasol-static-score",
    "crates/pasol-reputation",
    "crates/pasol-lab",
    "crates/pasol-patterns",
    "crates/pasol-trust",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["PasolSecurity contributors"]
repository = "https://github.com/PasolSecurity/pasol-detection"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
schemars = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
semver = "1.0"
pasol-trust = { path = "crates/pasol-trust" }
jsonschema = "0.29"
rand_core = { version = "0.6", features = ["getrandom"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
atomic-write-file = "0.3"
proptest = "1.6"
yara-x = { version = "=1.19.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "generate-proto-code", "pe-module", "hash-module", "math-module", "string-module"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
