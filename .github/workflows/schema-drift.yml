name: schema-drift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema-drift:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace schema
      - run: cargo test -p pasol-reputation --test goldens
      - run: cargo test -p pasol-patterns --test contracts
      - run: cargo test -p pasol-trust --test store
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins
