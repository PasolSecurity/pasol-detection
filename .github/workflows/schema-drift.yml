name: schema-drift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema-drift:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace schema
      - run: cargo test -p pasol-reputation --test goldens
