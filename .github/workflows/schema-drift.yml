name: schema-drift

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace schema
